name: Deploy S2 to GitHub Pages

# 触发条件：推送到 main 分支时自动触发
on:
  push:
    branches:
      - main
  # 也支持手动触发
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取源码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: luoke4.0/package-lock.json

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci
        working-directory: luoke4.0

      # 4. 构建（注入 S2 的 base path，跳过图片压缩以加速 CI）
      - name: Build for S2
        run: VITE_BASE_PATH=/Yise--assistant-s2/ npx vite build
        working-directory: luoke4.0
        env:
          # 把 Supabase 密钥从 GitHub Secrets 注入（见下方说明）
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 5. 把 dist/ 推送到目标仓库的 gh-pages 分支
      - name: Deploy to Yise--assistant-s2
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 用于推送到目标仓库的 Personal Access Token（见下方说明）
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: 05RubyTang/Yise--assistant-s2
          publish_branch: gh-pages
          publish_dir: luoke4.0/dist
          # 每次部署会完整替换，不保留历史 commit（保持 gh-pages 分支干净）
          force_orphan: true
          # 自定义 commit 信息
          commit_message: "chore: deploy ${{ github.sha }}"
